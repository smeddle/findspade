[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findspade"
version = "0.1.0"
description = "Snapshot and analyse eBay sales of UK antiquities to US buyers."
requires-python = ">=3.11"
dependencies = ["beautifulsoup4", "lxml", "playwright"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
findspade = "findspade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
